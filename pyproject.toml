[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-ai-corporate-agent"
version = "0.6.0"
description = "Agente corporativo RAG con interfaz Streamlit, monitoreo y despliegue Docker."
requires-python = ">=3.11"
dependencies = [
    "pypdf>=5.7,<7",
    "python-docx>=1.2,<2",
    "openpyxl>=3.1,<4",
    "python-pptx>=1.0,<2",
    "beautifulsoup4>=4.12,<5",
    "chromadb>=1,<2",
    "fastembed>=0.7,<1",
    "numpy>=1.26,<3",
    "oci>=2.150,<3",
    "streamlit>=1.40,<2",
    "python-dotenv>=1,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
